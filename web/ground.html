<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D ground prototype</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .controls,
      .transport {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: center;
        margin: 0 0 8px;
      }
      .transport input[type='range'] {
        flex: 1 1 200px;
      }
      input[type='number'] {
        width: 6em;
      }
      .panes {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .box {
        position: relative;
        overflow: hidden;
        width: min(420px, 100%);
        aspect-ratio: 4 / 5;
        border-radius: 4px;
        background: #245f28;
      }
      .ground-3d,
      .ground-overlay {
        position: absolute;
        top: 0;
        left: 0;
        image-rendering: pixelated;
      }
      .ground-overlay {
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .ground-2d {
        display: block;
        width: 100%;
        height: 100%;
      }
      pre {
        margin: 8px 0 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>3D ground prototype</h1>
    <main id="ground"></main>
    <script type="module" src="./src/view/ground-prototype/page.ts"></script>
  </body>
</html>
